<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Section 4 - Infinite Room</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=JetBrains+Mono:wght@400;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="flash-overlay"></div>

    <div id="zoom-container">
        <div id="grid-lines"></div>
        <div id="grid-labels">
            <div class="serif-label">Grid-Structure</div>
            <div class="serif-label">Tension</div>
            <div class="serif-label">Analog Space</div>
        </div>
        <div id="reality-check">[ // BULLSHIT ]</div>
        <div id="grind-terminal">
            <div id="grind-text-1"></div>
            <div id="grind-bar"></div>
            <div id="grind-text-2"></div>
        </div>
        <div id="bracket-box">
            <div class="bracket top-left"></div>
            <div class="bracket top-right"></div>
            <div class="bracket bottom-left"></div>
            <div class="bracket bottom-right"></div>
            <div id="bracket-text"></div>
        </div>
    </div>

    <div id="mount-terminal">
        <div id="mount-content"></div>
    </div>

    <div id="mic-drop-container">
        <div id="blinking-cursor">_</div>
        <div id="foundation-line"></div>
        <div id="final-text">NEXT:<br>100% INTERFACE</div>
    </div>

    <div id="ui-container">
        <!-- TICK 1: The Void -->
        <div id="tick-1" class="tick active">
            <div id="phone-frame"></div>
        </div>

        <canvas id="data-canvas"></canvas>

        <div id="overlay-left" class="image-overlay">
            <img id="img-left" src="pappe.png" alt="System Dump 1">
            <div class="label">FILE: PAPPE_01.DMP</div>
        </div>
        <div id="overlay-right" class="image-overlay">
            <img id="img-right" src="pappe.png" alt="System Dump 2">
            <div class="label">FILE: PAPPE_02.DMP</div>
        </div>

        <div id="matchcut-overlay">
            <video id="matchcut-video-1" class="poster-video" src="zeitimraum.mp4" muted loop playsinline></video>
            <video id="matchcut-video-2" class="poster-video" src="001_Video_Luca_Z2.mp4" muted loop
                playsinline></video>
        </div>

        <div id="filter-box">
            <div class="formula">
                <i>y</i> = &alpha; * <i>x</i> + (1 - &alpha;) * <i>y<sub>prev</sub></i>
            </div>
            <div class="label">LOW_PASS_FILTER_v1.0.4</div>
        </div>

        <div id="terminal-screen">
            <div id="terminal-content"></div>
            <span class="cursor">_</span>
        </div>

        <div id="clash-container">
            <div id="deadpan-zero">[ 0 ]</div>
            <div id="chair-well"></div>
            <div id="error-container"></div>
        </div>
    </div>

    <canvas id="three-canvas"></canvas>

    <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <script type="module" src="app.js"></script>
</body>

</html>
